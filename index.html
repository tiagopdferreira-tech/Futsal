<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão Futsal</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #10b981; --text: #f8fafc; --border: #334155; --danger: #ef4444; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 12px; }
    .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    input, select, button { background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 8px; font-size: 14px; width: 100%; margin-top: 6px; }
    button { background: var(--accent); color: #0f172a; font-weight: bold; border: none; cursor: pointer; }
    .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 8px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>

<div class="container">
  <h2>Futsal Quinta-Feira</h2>

  <!-- 1. ADICIONAR JOGADOR -->
  <div class="card">
    <h3>1. Adicionar Jogador</h3>
    <div style="display:flex; gap:8px;">
      <input type="text" id="playerName" placeholder="Nome do jogador">
      <button onclick="addPlayer()" style="width: auto;">Guardar</button>
    </div>
  </div>

  <!-- 2. REGISTAR JOGO -->
  <div class="card">
    <h3>2. Registar Jogo</h3>
    
    <div style="display:flex; gap:8px;">
      <input type="number" id="scoreA" value="0" placeholder="Equipa A">
      <input type="number" id="scoreB" value="0" placeholder="Equipa B">
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:10px;">
      <div>
        <h4 style="color:#60a5fa; margin:0;">Equipa A</h4>
        <select id="selectA" onchange="addToTeam('A')"><option value="">+ Jogador</option></select>
        <div id="listA"></div>
      </div>
      <div>
        <h4 style="color:#f87171; margin:0;">Equipa B</h4>
        <select id="selectB" onchange="addToTeam('B')"><option value="">+ Jogador</option></select>
        <div id="listB"></div>
      </div>
    </div>

    <button onclick="saveMatch()" style="margin-top:16px;">Gravar Resultado</button>
  </div>

  <!-- 3. CLASSIFICAÇÃO -->
  <div class="card">
    <h3>3. Tabela de Classificação</h3>
    <table>
      <thead>
        <tr><th>Pos</th><th>Nome</th><th>Pts</th><th>Golos</th><th>J</th></tr>
      </thead>
      <tbody id="leaderboard"></tbody>
    </table>
  </div>
</div>

<script>
  let players = [];
  let teamA = [];
  let teamB = [];

  // Tenta carregar dados guardados em segurança
  try {
    const saved = localStorage.getItem('futsal_db');
    if (saved) players = JSON.parse(saved);
  } catch (e) {
    console.error("Erro ao aceder ao localStorage", e);
  }

  function saveData() {
    try {
      localStorage.setItem('futsal_db', JSON.stringify(players));
    } catch (e) {
      alert("Aviso: O seu navegador está a bloquear a gravação de dados.");
    }
  }

  function addPlayer() {
    const input = document.getElementById('playerName');
    const name = input.value.trim();
    if (!name) return;

    players.push({ id: Date.now(), name: name, points: 0, goals: 0, played: 0 });
    input.value = '';
    saveData();
    render();
  }

  function renderSelects() {
    const selA = document.getElementById('selectA');
    const selB = document.getElementById('selectB');
    selA.innerHTML = '<option value="">+ Jogador</option>';
    selB.innerHTML = '<option value="">+ Jogador</option>';

    players.forEach(p => {
      const inA = teamA.some(t => t.id === p.id);
      const inB = teamB.some(t => t.id === p.id);
      if (!inA && !inB) {
        selA.innerHTML += `<option value="${p.id}">${p.name}</option>`;
        selB.innerHTML += `<option value="${p.id}">${p.name}</option>`;
      }
    });
  }

  function addToTeam(team) {
    const select = document.getElementById(team === 'A' ? 'selectA' : 'selectB');
    const id = Number(select.value);
    if (!id) return;

    const p = players.find(x => x.id === id);
    if (team === 'A') teamA.push({ ...p, goals: 0 });
    if (team === 'B') teamB.push({ ...p, goals: 0 });

    select.value = '';
    render();
  }

  function updateGoals(team, id, goals) {
    const list = team === 'A' ? teamA : teamB;
    const p = list.find(x => x.id === id);
    if (p) p.goals = Number(goals);
  }

  function renderTeams() {
    document.getElementById('listA').innerHTML = teamA.map(p => `
      <div class="row">
        <span>${p.name}</span>
        <input type="number" value="${p.goals}" style="width:50px;" onchange="updateGoals('A', ${p.id}, this.value)">
      </div>
    `).join('');

    document.getElementById('listB').innerHTML = teamB.map(p => `
      <div class="row">
        <span>${p.name}</span>
        <input type="number" value="${p.goals}" style="width:50px;" onchange="updateGoals('B', ${p.id}, this.value)">
      </div>
    `).join('');
  }

  function saveMatch() {
    const sA = Number(document.getElementById('scoreA').value);
    const sB = Number(document.getElementById('scoreB').value);

    if (teamA.length === 0 || teamB.length === 0) {
      alert("Adiciona jogadores a ambas as equipas!");
      return;
    }

    let pA = 1, pB = 1;
    if (sA > sB) { pA = 4; pB = 1; }
    else if (sB > sA) { pA = 1; pB = 4; }
    else { pA = 2; pB = 2; }

    players.forEach(p => {
      const inA = teamA.find(x => x.id === p.id);
      const inB = teamB.find(x => x.id === p.id);
      if (inA) { p.points += pA; p.goals += inA.goals; p.played += 1; }
      if (inB) { p.points += pB; p.goals += inB.goals; p.played += 1; }
    });

    teamA = []; teamB = [];
    document.getElementById('scoreA').value = 0;
    document.getElementById('scoreB').value = 0;

    saveData();
    render();
    alert("Jogo gravado com sucesso!");
  }

  function renderTable() {
    const sorted = [...players].sort((a, b) => b.points - a.points || b.goals - a.goals);
    document.getElementById('leaderboard').innerHTML = sorted.map((p, i) => `
      <tr>
        <td><strong>${i + 1}º</strong></td>
        <td>${p.name}</td>
        <td><strong>${p.points}</strong></td>
        <td>${p.goals}</td>
        <td>${p.played}</td>
      </tr>
    `).join('');
  }

  function render() {
    renderSelects();
    renderTeams();
    renderTable();
  }

  render();
</script>

</body>
</html>
