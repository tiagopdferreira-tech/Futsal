<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão Futsal Quinta-Feira</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --excel: #16a34a;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 { font-size: 1.4rem; margin: 0 0 4px 0; }
    h2 { font-size: 1.1rem; margin: 0 0 12px 0; color: #38bdf8; }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .grid-details {
      display: grid;
      grid-template-columns: 1fr 1fr 2fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    @media (max-width: 600px) {
      .grid-2, .grid-details { grid-template-columns: 1fr; }
    }

    input, select, textarea, button {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      width: 100%;
    }

    textarea { resize: vertical; min-height: 60px; font-family: inherit; }

    button {
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .btn-excel { background: var(--excel); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-edit { background: var(--gold); color: #0f172a; padding: 4px 8px; font-size: 12px; width: auto; }

    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }

    .player-controls { display: flex; align-items: center; gap: 6px; }
    .player-controls input[type="number"] { width: 55px; text-align: center; }

    .score-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: bold;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .score-box input { width: 50px; text-align: center; font-size: 18px; font-weight: bold; }
    .table-wrapper { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-size: 11px; text-transform: uppercase; }

    .match-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 12px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    .match-img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 8px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      padding: 12px;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      max-width: 550px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <div>
    <h1>Futsal Quinta-Feira</h1>
    <span style="color: var(--text-muted); font-size: 12px;">Gestão de Jogos, Estatísticas e Histórico</span>
  </div>

  <!-- 1. JOGADORES -->
  <div class="card">
    <h2>1. Gestão de Jogadores</h2>
    <div style="display:flex; gap:8px; margin-bottom: 12px;">
      <input type="text" id="playerName" placeholder="Nome do Novo Jogador">
      <button onclick="addPlayer()" style="width: auto; padding: 0 16px;">Adicionar</button>
    </div>
    
    <label style="font-size:11px; color:var(--text-muted);">Jogadores Registados (Editar / Remover):</label>
    <div id="registeredPlayersList" style="margin-top:6px;"></div>
  </div>

  <!-- 2. REGISTAR JOGO -->
  <div class="card">
    <h2>2. Registar Jogo</h2>

    <div class="grid-details">
      <div>
        <label style="font-size:11px; color:var(--text-muted);">Data:</label>
        <input type="date" id="matchDate">
      </div>
      <div>
        <label style="font-size:11px; color:var(--text-muted);">Hora:</label>
        <input type="time" id="matchTime" value="21:00">
      </div>
      <div>
        <label style="font-size:11px; color:var(--text-muted);">Pavilhão:</label>
        <input type="text" id="matchLocation" placeholder="Local do jogo">
      </div>
    </div>

    <div class="score-box">
      <span>Equipa A</span>
      <input type="number" id="scoreA" value="0" min="0">
      <span>vs</span>
      <input type="number" id="scoreB" value="0" min="0">
      <span>Equipa B</span>
    </div>

    <div class="grid-2">
      <div>
        <h3 style="color: #60a5fa; margin: 0 0 8px 0;">Equipa A</h3>
        <select id="selectA" onchange="addPlayerToTeam('A')"><option value="">+ Jogador</option></select>
        <div id="listA"></div>
      </div>

      <div>
        <h3 style="color: #f87171; margin: 0 0 8px 0;">Equipa B</h3>
        <select id="selectB" onchange="addPlayerToTeam('B')"><option value="">+ Jogador</option></select>
        <div id="listB"></div>
      </div>
    </div>

    <div style="margin-top: 12px;">
      <label style="font-size:11px; color:var(--text-muted);">📷 Foto do Jogo (Opcional):</label>
      <input type="file" id="matchPhoto" accept="image/*" style="margin-top:4px; margin-bottom: 8px;">

      <label style="font-size:11px; color:var(--text-muted);">📝 História / Comentário (Opcional):</label>
      <textarea id="matchStory" placeholder="Resumo do jogo..."></textarea>
    </div>

    <button onclick="saveMatch()" style="margin-top: 12px; padding: 12px;">Gravar Jogo e Atualizar Pontos</button>
  </div>

  <!-- AÇÕES -->
  <div style="display: flex; justify-content: flex-end; gap: 8px;">
    <button onclick="exportToExcel()" class="btn-excel" style="width: auto; padding: 8px 12px;">📥 Exportar Excel</button>
    <button onclick="resetData()" class="btn-danger" style="width: auto; padding: 8px 12px; font-size:12px;">Limpar Dados</button>
  </div>

  <!-- TABELAS -->
  <div class="grid-2">
    <div class="card">
      <h2 style="color: #f59e0b;">🏆 Bola de Ouro</h2>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Pos</th><th>Nome</th><th>Pts</th><th>J</th><th>V</th></tr></thead>
          <tbody id="leaderboardPoints"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2 style="color: #10b981;">👟 Bota de Ouro</h2>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Pos</th><th>Nome</th><th>Golos</th><th>J</th></tr></thead>
          <tbody id="leaderboardGoals"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- HISTÓRICO -->
  <div class="card">
    <h2>4. Histórico de Jogos</h2>
    <div id="historyList"></div>
  </div>
</div>

<!-- MODAL EDITAR JOGO COMPLETO -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h2>✏️ Editar Informações do Jogo</h2>
    <input type="hidden" id="editMatchId">

    <div class="grid-details" style="margin-top:10px;">
      <div>
        <label style="font-size:11px; color:var(--text-muted);">Data:</label>
        <input type="date" id="editDate">
      </div>
      <div>
        <label style="font-size:11px; color:var(--text-muted);">Hora:</label>
        <input type="time" id="editTime">
      </div>
      <div>
        <label style="font-size:11px; color:var(--text-muted);">Pavilhão:</label>
        <input type="text" id="editLocation">
      </div>
    </div>

    <div class="score-box">
      <span>Eq. A</span>
      <input type="number" id="editScoreA" min="0">
      <span>vs</span>
      <input type="number" id="editScoreB" min="0">
      <span>Eq. B</span>
    </div>

    <label style="font-size:11px; color:var(--text-muted);">📝 Comentário / História:</label>
    <textarea id="editStory" style="margin-bottom:12px;"></textarea>

    <label style="font-size:11px; color:var(--text-muted);">📷 Substituir Foto:</label>
    <input type="file" id="editPhoto" accept="image/*" style="margin-bottom:16px;">

    <div style="display:flex; gap:8px;">
      <button onclick="saveEditMatch()">Guardar Alterações</button>
      <button onclick="closeModal()" class="btn-danger">Cancelar</button>
    </div>
  </div>
</div>

<script>
  let players = JSON.parse(localStorage.getItem('futsal_players_v2')) || [];
  let matches = JSON.parse(localStorage.getItem('futsal_matches_v2')) || [];
  let teamA = [];
  let teamB = [];

  document.getElementById('matchDate').valueAsDate = new Date();

  function saveStorage() {
    try {
      localStorage.setItem('futsal_players_v2', JSON.stringify(players));
      localStorage.setItem('futsal_matches_v2', JSON.stringify(matches));
    } catch (e) {
      alert("Aviso: O armazenamento local está cheio. A foto pode não ter sido guardada.");
    }
  }

  function addPlayer() {
    const input = document.getElementById('playerName');
    const name = input.value.trim();
    if (!name) return;

    if (players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
      alert("Este jogador já existe!");
      return;
    }

    players.push({ id: Date.now(), name: name, points: 0, goals: 0, played: 0, wins: 0, draws: 0, losses: 0 });
    input.value = '';
    saveStorage();
    render();
  }

  function editPlayerName(id) {
    const p = players.find(x => x.id === id);
    if (!p) return;

    const newName = prompt("Alterar nome do jogador:", p.name);
    if (newName && newName.trim() !== "") {
      p.name = newName.trim();
      saveStorage();
      render();
    }
  }

  function deletePlayer(id) {
    const p = players.find(x => x.id === id);
    if (!p) return;

    if (confirm(`Tem a certeza que deseja remover ${p.name}?`)) {
      players = players.filter(x => x.id !== id);
      teamA = teamA.filter(x => x.id !== id);
      teamB = teamB.filter(x => x.id !== id);
      saveStorage();
      render();
    }
  }

  function renderRegisteredPlayers() {
    const container = document.getElementById('registeredPlayersList');
    if (players.length === 0) {
      container.innerHTML = `<span style="color:var(--text-muted); font-size:12px;">Nenhum jogador registado ainda.</span>`;
      return;
    }

    container.innerHTML = players.map(p => `
      <div class="player-row">
        <span>${p.name}</span>
        <div class="player-controls">
          <button onclick="editPlayerName(${p.id})" class="btn-edit">✏️ Alterar</button>
          <button onclick="deletePlayer(${p.id})" class="btn-danger" style="width:auto; padding:3px 8px; font-size:12px;">✕</button>
        </div>
      </div>
    `).join('');
  }

  function renderSelects() {
    const selA = document.getElementById('selectA');
    const selB = document.getElementById('selectB');
    selA.innerHTML = '<option value="">+ Jogador</option>';
    selB.innerHTML = '<option value="">+ Jogador</option>';

    players.forEach(p => {
      const inA = teamA.some(t => t.id === p.id);
      const inB = teamB.some(t => t.id === p.id);
      if (!inA && !inB) {
        selA.innerHTML += `<option value="${p.id}">${p.name}</option>`;
        selB.innerHTML += `<option value="${p.id}">${p.name}</option>`;
      }
    });
  }

  function addPlayerToTeam(team) {
    const select = document.getElementById(team === 'A' ? 'selectA' : 'selectB');
    const id = Number(select.value);
    if (!id) return;

    const p = players.find(x => x.id === id);
    if (team === 'A') teamA.push({ ...p, matchGoals: 0, isCaptain: false });
    if (team === 'B') teamB.push({ ...p, matchGoals: 0, isCaptain: false });

    select.value = '';
    render();
  }

  function removePlayer(team, id) {
    if (team === 'A') teamA = teamA.filter(p => p.id !== id);
    if (team === 'B') teamB = teamB.filter(p => p.id !== id);
    render();
  }

  function updateGoals(team, id, val) {
    const list = team === 'A' ? teamA : teamB;
    const p = list.find(x => x.id === id);
    if (p) p.matchGoals = Number(val);
  }

  function toggleCaptain(team, id) {
    const list = team === 'A' ? teamA : teamB;
    list.forEach(p => p.isCaptain = (p.id === id));
    render();
  }

  function renderTeams() {
    document.getElementById('listA').innerHTML = teamA.map(p => `
      <div class="player-row">
        <span>${p.name} ${p.isCaptain ? '👑' : ''}</span>
        <div class="player-controls">
          <button onclick="toggleCaptain('A', ${p.id})" style="width:auto; padding:2px 6px; font-size:10px;">👑</button>
          <input type="number" min="0" value="${p.matchGoals}" onchange="updateGoals('A', ${p.id}, this.value)">
          <button onclick="removePlayer('A', ${p.id})" class="btn-danger" style="width:auto; padding:2px 6px;">✕</button>
        </div>
      </div>
    `).join('');

    document.getElementById('listB').innerHTML = teamB.map(p => `
      <div class="player-row">
        <span>${p.name} ${p.isCaptain ? '👑' : ''}</span>
        <div class="player-controls">
          <button onclick="toggleCaptain('B', ${p.id})" style="width:auto; padding:2px 6px; font-size:10px;">👑</button>
          <input type="number" min="0" value="${p.matchGoals}" onchange="updateGoals('B', ${p.id}, this.value)">
          <button onclick="removePlayer('B', ${p.id})" class="btn-danger" style="width:auto; padding:2px 6px;">✕</button>
        </div>
      </div>
    `).join('');
  }

  function compressImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 800;
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDim) {
            height *= maxDim / width;
            width = maxDim;
          } else if (height > maxDim) {
            width *= maxDim / height;
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function saveMatch() {
    const sA = Number(document.getElementById('scoreA').value);
    const sB = Number(document.getElementById('scoreB').value);
    const date = document.getElementById('matchDate').value;
    const time = document.getElementById('matchTime').value;
    const location = document.getElementById('matchLocation').value.trim() || 'Pavilhão';
    const story = document.getElementById('matchStory').value.trim();
    const photoInput = document.getElementById('matchPhoto');

    if (!date) return alert("Indica a data do jogo.");
    if (teamA.length === 0 || teamB.length === 0) return alert("Adiciona jogadores a ambas as equipas.");

    const totA = teamA.reduce((sum, p) => sum + p.matchGoals, 0);
    const totB = teamB.reduce((sum, p) => sum + p.matchGoals, 0);

    if (totA !== sA || totB !== sB) {
      return alert("A soma dos golos dos jogadores não corresponde ao resultado global.");
    }

    let photoBase64 = "";
    if (photoInput.files && photoInput.files[0]) {
      photoBase64 = await compressImage(photoInput.files[0]);
    }

    let pA = 1, pB = 1, resA = 'loss', resB = 'loss';
    if (sA > sB) { pA = 4; pB = 1; resA = 'win'; resB = 'loss'; }
    else if (sB > sA) { pA = 1; pB = 4; resA = 'loss'; resB = 'win'; }
    else { pA = 2; pB = 2; resA = 'draw'; resB = 'draw'; }

    const capA = teamA.find(p => p.isCaptain)?.name || 'N/A';
    const capB = teamB.find(p => p.isCaptain)?.name || 'N/A';

    matches.unshift({
      id: Date.now(), date, time, location, scoreA: sA, scoreB: sB,
      capA, capB, story, photo: photoBase64
    });

    players.forEach(p => {
      const inA = teamA.find(x => x.id === p.id);
      const inB = teamB.find(x => x.id === p.id);

      if (inA) {
        p.points += pA; p.goals += inA.matchGoals; p.played++;
        if (resA === 'win') p.wins++; else if (resA === 'draw') p.draws++; else p.losses++;
      } else if (inB) {
        p.points += pB; p.goals += inB.matchGoals; p.played++;
        if (resB === 'win') p.wins++; else if (resB === 'draw') p.draws++; else p.losses++;
      }
    });

    teamA = []; teamB = [];
    document.getElementById('scoreA').value = 0;
    document.getElementById('scoreB').value = 0;
    document.getElementById('matchStory').value = '';
    document.getElementById('matchPhoto').value = '';

    saveStorage();
    render();
    alert("Jogo gravado com sucesso!");
  }

  function renderLeaderboards() {
    const sortedPts = [...players].sort((a, b) => b.points - a.points || b.goals - a.goals);
    document.getElementById('leaderboardPoints').innerHTML = sortedPts.map((p, i) => `
      <tr>
        <td><strong>${i + 1}º</strong></td>
        <td>${p.name}</td>
        <td style="color:var(--gold); font-weight:bold;">${p.points}</td>
        <td>${p.played}</td>
        <td>${p.wins}</td>
      </tr>
    `).join('');

    const sortedGls = [...players].sort((a, b) => b.goals - a.goals || b.points - a.points);
    document.getElementById('leaderboardGoals').innerHTML = sortedGls.map((p, i) => `
      <tr>
        <td><strong>${i + 1}º</strong></td>
        <td>${p.name}</td>
        <td style="color:var(--accent); font-weight:bold;">${p.goals}</td>
        <td>${p.played}</td>
      </tr>
    `).join('');
  }

  function renderHistory() {
    const container = document.getElementById('historyList');
    if (matches.length === 0) {
      container.innerHTML = `<span style="color:var(--text-muted); font-size:12px;">Nenhum jogo registado.</span>`;
      return;
    }

    container.innerHTML = matches.map(m => `
      <div class="match-card">
        <div class="match-header">
          <span>📅 ${m.date} às ${m.time} (📍 ${m.location})</span>
          <button onclick="openModal(${m.id})" class="btn-edit">✏️ Editar Jogo</button>
        </div>
        <div style="display:flex; justify-content:space-between; font-weight:bold;">
          <span style="color:#60a5fa;">Eq. A (${m.scoreA}) <small>👑 ${m.capA}</small></span>
          <span>vs</span>
          <span style="color:#f87171;">Eq. B (${m.scoreB}) <small>👑 ${m.capB}</small></span>
        </div>
        ${m.story ? `<div style="margin-top:6px; font-style:italic; font-size:12px; color:#cbd5e1;">"${m.story}"</div>` : ''}
        ${m.photo ? `<img src="${m.photo}" class="match-img">` : ''}
      </div>
    `).join('');
  }

  function openModal(id) {
    const m = matches.find(x => x.id === id);
    if (!m) return;

    document.getElementById('editMatchId').value = id;
    document.getElementById('editDate').value = m.date;
    document.getElementById('editTime').value = m.time;
    document.getElementById('editLocation').value = m.location;
    document.getElementById('editScoreA').value = m.scoreA;
    document.getElementById('editScoreB').value = m.scoreB;
    document.getElementById('editStory').value = m.story || '';

    document.getElementById('editModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('editModal').style.display = 'none';
  }

  async function saveEditMatch() {
    const id = Number(document.getElementById('editMatchId').value);
    const m = matches.find(x => x.id === id);
    if (!m) return;

    m.date = document.getElementById('editDate').value;
    m.time = document.getElementById('editTime').value;
    m.location = document.getElementById('editLocation').value.trim();
    m.scoreA = Number(document.getElementById('editScoreA').value);
    m.scoreB = Number(document.getElementById('editScoreB').value);
    m.story = document.getElementById('editStory').value.trim();

    const photoInput = document.getElementById('editPhoto');
    if (photoInput.files && photoInput.files[0]) {
      m.photo = await compressImage(photoInput.files[0]);
    }

    saveStorage();
    render();
    closeModal();
    alert("Jogo atualizado com sucesso!");
  }

  function exportToExcel() {
    if (players.length === 0) return alert("Sem dados para exportar.");

    const loadScript = new Promise((resolve) => {
      if (window.XLSX) return resolve();
      const script = document.createElement('script');
      script.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
      script.onload = () => resolve();
      document.head.appendChild(script);
    });

    loadScript.then(() => {
      const sorted = [...players].sort((a, b) => b.points - a.points || b.goals - a.goals);
      const data = sorted.map((i, p) => ({
        "Posição": `${p + 1}º`, "Jogador": i.name, "Pontos": i.points,
        "Golos": i.goals, "Jogos": i.played, "Vitórias": i.wins, "Empates": i.draws, "Derrotas": i.losses
      }));

      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Classificação");
      XLSX.writeFile(wb, "Futsal_Classificacao.xlsx");
    });
  }

  function resetData() {
    if (confirm("Tens a certeza que queres apagar todos os dados?")) {
      players = []; matches = []; teamA = []; teamB = [];
      saveStorage();
      render();
    }
  }

  function render() {
    renderRegisteredPlayers();
    renderSelects();
    renderTeams();
    renderLeaderboards();
    renderHistory();
  }

  render();
</script>

</body>
</html>
